name: Feature request
description: An idea to make Yapper better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Yapper stays free, unlimited and on-device, with no account and no network use beyond the model download.
        Ideas that need a server or a cloud model are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches and examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
